  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n  .eyebrow{\n    font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;\n    color:var(--blue);margin-bottom:13px;display:inline-flex;align-items:center;gap:8px;\n  }\n  .eyebrow:before{content:\"\";width:22px;height:2px;background:var(--blue);border-radius:2px;}\n  .section{padding:62px 0;}\n  .lead{font-size:16.5px;color:var(--ink-2);}\n\n  /* ---------- Buttons ---------- */\n  .btn{\n    display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;\n    padding:12px 22px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;\n    transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease,color .16s ease;\n    white-space:nowrap;letter-spacing:.005em;\n  }\n  .btn svg{width:15px;height:15px;}\n  .btn-blue{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(59,125,216,.26);}\n  .btn-blue:hover{background:var(--blue-deep);transform:translateY(-2px);box-shadow:0 12px 26px rgba(59,125,216,.34);}\n  .btn-dark{background:var(--ink);color:#fff;}\n  .btn-dark:hover{background:#161f27;transform:translateY(-2px);}\n  .btn-outline{background:var(--surface);color:var(--ink);border-color:var(--line-2);}\n  .btn-outline:hover{border-color:var(--ink);transform:translateY(-2px);}\n  .btn-sm{padding:10px 18px;font-size:13.5px;}\n  .btn-lg{padding:15px 28px;font-size:15.5px;}\n  .btn-white{background:#fff;color:var(--blue-deep);box-shadow:0 8px 20px rgba(20,28,36,.18);}\n  .btn-white:hover{background:#fff;transform:translateY(-2px);box-shadow:0 12px 26px rgba(20,28,36,.24);}\n\n  /* ---------- Floating pill header ---------- */\n  header.site{position:fixed;top:0;left:0;right:0;z-index:60;padding:16px 0;background:transparent;transition:padding .4s cubic-bezier(.65,0,.2,1);}\n  header.site.shrunk-head{padding:10px 0;}\n  header.site .wrap{padding:0 22px;}\n  .nav{\n    display:flex;align-items:center;justify-content:space-between;gap:20px;\n    background:#38424c;backdrop-filter:satu gin-bottom:6px;letter-spacing:.01em;}\n  form.contact input,form.contact textarea,form.contact select{\n    width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);\n    font-family:var(--font);font-size:14.5px;padding:11px 13px;transition:border-color .16s ease,background .16s ease;\n  }\n  form.contact input:focus,form.contact textarea:focus,form.contact select:focus{outline:none;border-color:var(--blue);background:#fff;}\n  form.contact textarea{min-height:110px;resize:vertical;}\n  .field.err input,.field.err textarea{border-color:#dd5d5d;}\n  .field .msg{color:#cc4f4f;font-size:12px;margin-top:5px;display:none;}\n  .field.err .msg{display:block;}\n  .form-note{font-size:12px;color:var(--muted);margin-top:12px;text-align:center;}\n  .form-ok{display:none;background:var(--blue-tint);border:1px solid var(--blue);color:var(--blue-deep);border-radius:10px;padding:14px 16px;font-weight:600;font-size:14px;}\n  .form-ok.show{display:block;}\n  .form-err{display:none;background:#fbeaea;border:1px solid #dd5d5d;color:#a93b3b;border-radius:10px;padding:12px 15px;font-weight:600;font-size:13.5px;margin-top:12px;}\n  .form-err.show{display:block;}\n  @media(max-width:820px){.contact-grid{grid-template-columns:1fr;}}\n\n  /* ---------- Footer ---------- */\n  footer.site{background:var(--surface);border-top:1px solid var(--line);padding:40px 0 28px;margin-top:24px;}\n  .foot{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}\n  .foot img{height:42px;}\n  .foot-nav{display:flex;gap:20px;flex-wrap:wrap;}\n  .foot-nav a{font-weight:600;font-size:13.5px;color:var(--body);}\n  .foot-nav a:hover{color:var(--blue);}\n  .ig{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1.5px solid var(--line-2);transition:.18s;}\n  .ig:hover{border-color:var(--ink);transform:translateY(-2px);}\n  .foot-bottom{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px;b -hl:var(--accent-tintlight);}\n  body[data-theme=\"charcoal\"]{--page-bg:#2c343d;--band-bg:#323b45;--foot-bg:#2c343d;--on-strong:#fff;--on-soft:rgba(255,255,255,.84);--divider:rgba(255,255,255,.13);--accent-hl:var(--accent-tintlight);}\n  body[data-theme=\"light\"]{--page-bg:#E7E3DB;--band-bg:#EEEAE2;--foot-bg:#EEEAE2;--on-strong:var(--ink);--on-soft:var(--ink-2);--divider:var(--line);--accent-hl:var(--blue-deep);}\n  body[data-theme=\"light\"] .foot-logo-light{display:none;}\n  body[data-theme=\"light\"] .foot-logo-ink{display:block;}\n\n  /* ===== Accent ===== */\n  body[data-accent=\"blue\"]{--blue:#3B7DD8;--blue-deep:#2E6BC4;--blue-tint:#EAF1FB;--accent-tintlight:#BAD4F4;}\n  body[data-accent=\"green\"]{--blue:#2E9E6B;--blue-deep:#247F55;--blue-tint:#E4F4EC;--accent-tintlight:#A9DDC2;}\n  body[data-accent=\"teal\"]{--blue:#1E9CA8;--blue-deep:#188089;--blue-tint:#E1F3F5;--accent-tintlight:#9FD9DF;}\n  body[data-accent=\"amber\"]{--blue:#C2913A;--blue-deep:#A2792B;--blue-tint:#F6EFDA;--accent-tintlight:#E6CF92;}\n\n  /* ===== Density ===== */\n  body[data-density=\"compact\"]{--sp:42px;--gap:14px;}\n  body[data-density=\"default\"]{--sp:62px;--gap:20px;}\n  body[data-density=\"spacious\"]{--sp:88px;--gap:30px;}\n\n  /* ============ Site footer (dark) ============ */\n  /* Global dark footer (rolled out site-wide) */\n  footer.site.footer-dark{background:#38424c;border-top:none;border-radius:clamp(10px,1.2vw,18px) clamp(10px,1.2vw,18px) 0 0;}\n  footer.site.footer-dark .foot{justify-content:flex-start;flex-flow:row wrap;align-items:center;gap:14px 18px;}\n  footer.site.footer-dark .foot .brand{flex-basis:auto;}\n  footer.site.footer-dark .foot-social{order:1;margin-left:auto;}\n  footer.site.footer-dark .foot-nav{order:2;flex-basis:100%;margin-left:0;}\n  footer.site.footer-dark .foot-nav a:first-child{padding-left:0;}\n  footer.site.footer-dark .foot .brand img{height:50px;}\n  footer.site.footer-dark .foot-social svg{width:18px;height:18px;}\n  footer.site.footer dards.<\u002Fp>\n        <p>Partner with Sparkle and you get a team that shows up on time, communicates clearly, and never cuts corners.<\u002Fp>\n        <p>Our commercial cleaning services span the entire Washington metropolitan area, including Arlington, Alexandria, Bethesda, Silver Spring, Rockville, Fairfax, and the surrounding Northern Virginia and Maryland suburbs. Whether you manage a single storefront or a portfolio of office towers, we tailor janitorial programs to your building's traffic, hours, and budget.<\u002Fp>\n        <p>We specialize in office cleaning, janitorial services, floor care and carpet cleaning, post-construction cleanup, disinfection, and recurring nightly maintenance. Fully licensed, bonded, and insured, our DMV cleaning crews follow OSHA-compliant procedures and use eco-friendly, low-VOC products that keep your workplace healthy and your indoor air quality high.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"photo-col\">\n        <span class=\"eyebrow\" aria-hidden=\"true\" style=\"visibility:hidden;\">Welcome to Sparkle Cleaning Services<\u002Fspan>\n        <div class=\"badge-row\">\n          <div class=\"float-badge trust-badge\">\n            <span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3c.8 5 2.2 6.4 7 7-4.8.6-6.2 2-7 7-.8-5-2.2-6.4-7-7 4.8-.6 6.2-2 7-7Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span class=\"bx\"><span class=\"bt\">We are TRUST<\u002Fspan><span class=\"bs\">by Sparkle. <a href=\"#about\" class=\"bs-link\">Learn more<\u002Fa><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"badge-pair\">\n            <div class=\"float-badge\">\n              <span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M tial communities looking their best across DC, Maryland and Virginia.<\u002Fp>\n        <p>Over more than a decade, Sparkle has grown from a small local crew into one of the DMV's most dependable commercial cleaning partners — serving clients throughout Washington DC, Arlington, Alexandria, Bethesda, Silver Spring, Rockville, Fairfax, and the surrounding Maryland and Northern Virginia suburbs.<\u002Fp>\n        <p>Our work spans office and corporate cleaning, medical and dental facility sanitation, school and daycare cleaning, retail and restaurant care, post-construction cleanup, floor stripping and waxing, carpet care, and recurring nightly janitorial programs. Fully licensed, bonded, and insured, our teams follow OSHA-compliant procedures and use eco-friendly, low-VOC products that protect your staff, visitors, and indoor air quality.<\u002Fp>\n        <p>From day porters to overnight crews, we build flexible schedules around your hours and budget — and back every account with responsive local management you can actually reach when it matters.<\u002Fp>\n        <div class=\"hero-cta\" style=\"margin-top:8px;\">\n          <a class=\"btn btn-blue\" href=\"#contact\">Contact Sales<\u002Fa>\n          <a class=\"btn btn-outline\" href=\"#services\">View All Services<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page inner-top\" id=\"page-services\" data-screen-label=\"Services\">\n  <div class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"cta-band\" style=\"margin-bottom:30px;\">\n        <h2>Looking for specialty services or special requirements? We've got you covered.<\u002Fh2>\n        <div class=\"hero-cta\">\n          <a class=\"btn btn-blue\" href=\"#contact\">Contact Us<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"svc-list\" id=\"svcList\"><\u002Fdiv>\n\n      <div class=\"seo-block\">\n        <div class=\"badge-line\"><svg viewBox=\"0 0 24 24\" fi
