    // asking the direct parent over the relay protocol above. An

    // degraded state as a refused embed.

          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

    // which fired before we swapped the document. Trigger manually if present.

      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

tent:space-between;gap:24px;flex-wrap:nowrap}\nnav.menu a,nav.menu .btn{white-space:nowrap;flex:none}\n.brand{display:flex;align-items:center;gap:13px;flex:none}\n\n.brand img{width:232px;height:auto;flex:none}\n.brand .bt{font-size:34px;font-weight:800;color:var(--navy);letter-spacing:-.03em;line-height:.95}\n.brand .bs{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--navy);text-transform:uppercase}\n.brand .btag{font-size:8.5px;font-weight:700;letter-spacing:.09em;color:var(--blue);text-transform:uppercase;margin-top:2px}\n.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px;min-width:0}\n.topbar .hd-meta{padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:11px}\n.hd-meta{display:flex;align-items:center;gap:22px;font-size:13.5px;color:var(--ink);flex-wrap:wrap;justify-content:flex-end}\n.hd-meta span,.hd-meta a{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:500}\n.hd-meta a{font-weight:700}\n.hd-meta svg{width:15px;height:15px;stroke:var(--blue);flex:none}\nnav.menu{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto;min-width:0}\nnav.menu a{color:var(--ink);font-size:15.5px;font-weight:500;position:relative;padding-bottom:4px}\nnav.menu a:hover{color:var(--blue)}\nnav.menu a.active{color:var(--blue);font-weight:600}\nnav.menu a.active:after{content:\"\";position:absolute;left:0;right:0;bottom:-2px;height:2.5px;background:var(--blue);border-radius:2px}\nnav.menu .btn{padding:13px 30px;font-size:15.5px}\n\n/* ---------- Hero ---------- */\n.hero{background:var(--navy);position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:stretch}\n.hero-copy{padding:76px 0 76px 0}\n.hero-copy .inner{max-width:620px;margin-left:auto;padding:0 48px 0 32px;width:100%}\n.kicker{display:flex;align-items:center;gap:14px;font-size:13.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:22px}\n.kicker:before{content:\"\";width:44px;height:3px;background:var(--blue-light);border-radius:2px;flex:none}\n.hero h1{font-size:clamp(40px,4.6vw,62px);font-weight:800;letter-spacing:-.016em;color:#fff;margin-bottom:24px;line-height:1.05}\n.hero h1 .hl{color:var(--blue-light);display:block}\n.hero p{color:rgba(255,255,255,.88);font-size:17px;line-height:1.65;margin-bottom:34px}\n.hero-cta{display:flex;gap:16px;flex-wrap:wrap}\n.hero-photo{position:relative;min-height:600px}\n.hero-photo image-slot{position:absolute;inset:0}\n\n/* ---------- Stats ---------- */\n.stats{background:var(--navy-2)}\n.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-top:34px;padding-bottom:34px}\n.stat{display:flex;align-items:center;gap:18px;justify-content:center;padding:4px 20px;border-left:1px solid rgba(255,255,255,.18)}\n.stat:first-child{border-left:none}\n.stat svg{width:44px;height:44px;stroke:#fff;flex:none}\n.stat .n{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.004em;line-height:1}\n.stat .l{font-size:14.5px;color:rgba(255,255,255,.82);margin-top:4px}\n\n/* ---------- Services ---------- */\n.services{background:var(--paper);padding:76px 0 84px;text-align:center}\n.eyebrow{font-size:14px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--navy);margin-bottom:16px}\n.services h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.012em;margin-bottom:18px}\n.rule{width:74px;height:4px;background:var(--blue);border-radius:2px;margin:0 auto 46px}\n.svc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:34px 20px}\n.svc{display:flex;flex-direction:column;align-items:center;gap:14px}\n.svc .ic{width:74px;height:74px;border-radius:50%;background:var(--tint);display:grid;place-items:center;transition:transform .18s ease,background .18s ease}\n.svc:hover .ic{transform:translateY(-4px);background:var(--tint-2)}\n.svc .ic svg{width:34px;height:34px;stroke:var(--navy);fill:none}\n.svc .nm{font-size:15px;font-weight:500;color:var(--ink);line-height:1.35;max-width:170px}\n\n/* ---------- Trust band ---------- */\n.trust{background:var(--navy);position:relative;overflow:hidden}\n.trust .wrap{display:grid;grid-template-columns:auto 1px 1fr;align-items:center;gap:56px;padding-top:72px;padding-bottom:72px}\n.trust .bigtype{font-size:clamp(42px,5.4vw,72px);font-weight:800;letter-spacing:-.018em;line-height:.98;color:#fff}\n.trust .bigtype em{display:block;font-style:normal;color:var(--blue-light);font-size:1.18em}\n.trust .divider{background:rgba(255,255,255,.28);align-self:stretch}\n.trust .rt p{color:#fff;font-size:19px;margin-bottom:26px;max-width:520px}\n.trust .spark{position:absolute;right:-10px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}\n.trust .spark svg{width:230px;height:230px;fill:var(--blue-light)}\n\n/* ---------- CTA ---------- */\n.cta{background:var(--paper);padding:56px 0 72px}\n.cta .box{display:grid;grid-template-columns:auto 1px 1fr auto auto;align-items:center;gap:30px}\n.cta .mark{width:96px;flex:none}\n.cta .vline{background:var(--blue);align-self:stretch;width:2px}\n.cta .box.nomark{grid-template-columns:2px 1fr auto auto}\n.cta h3{font-size:clamp(21px,2.4vw,28px);font-weight:800;letter-spacing:-.008em;margin-bottom:6px}\n.cta p{margin:0;font-size:16.5px}\n.checks{display:grid;gap:11px}\n.checks li{display:flex;align-items:center;gap:11px;font-size:15.5px;color:var(--ink)}\n.checks{list-style:none;padding:0;margin:0}\n.checks .ck{width:22px;height:22px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}\n.checks .ck svg{width:13px;height:13px;stroke:#fff;stroke-width:3}\n\n@media(max-width:1080px){\n.hero{grid-template-columns:1fr}\n.hero-copy .inner{max-width:var(--maxw);margin:0 auto;padding:0 32px}\n.hero-photo{min-height:340px}\n.stats .wrap{grid-template-columns:repeat(2,1fr);gap:26px 0}\n.stat:nth-child(3){border-left:none}\n.svc-grid{grid-template-columns:repeat(3,1fr)}\n.trust .wrap{grid-template-columns:1fr;ga
